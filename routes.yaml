routes:
  /:
    data: page.home
    template: page

  # Data-driven election/finance routes
  /lookup/:
    template: lookup
  /lookup/{agency}/:
    template: lookup-agency
    # next link /officials/{slug}/
  
  /jobs/:
    template: job
  /jobs/{agency}/:
    template: job-agency
  /jobs/{agency}/{seat}/:
    template: job-agency-seat

  /elections/:
    template: election
  /elections/{agency}/:
    template: election-agency
  /elections/{agency}/{seat}/:
    template: election-agency-seat
  /elections/{agency}/{seat}/{year}/:
    template: election-agency-seat-year
  
  /donors/:
    template: donors
  /donors/{slug}/:
    template: donor
  
  /finance/:
    template: finance
  /finance/{agency}/{seat}/:
    template: finance-agency-seat
  /finance/{seat}/:
    template: finance-seat
  /finance/{seat}/{donor}/:
    template: finance-seat-donor

  /officials/:
    template: officials
  /official/{slug}/:
    template: official
  /officials/{agency}/: #seo
    template: official-agency

collections:
  /collections/:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
