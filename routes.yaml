routes:
  /:
    data: page.home
    template: page

  # Proof of concept: explicit route with Page data
  /jobs/lancaster-county/county-commissioner/:
    template: job-agency-seat
    data: page.job-agency-seat-lancaster-county-county-commissioner

  # Data-driven election/finance routes
  /lookup/:
    template: lookup
  /lookup/{agency}/:
    template: lookup-agency
    # next link /official/{slug}/  (singular — /officials/{x}/ is the agency route below)
  
  /jobs/:
    template: job
  /jobs/{agency}/:
    template: job-agency
  /jobs/{agency}/{seat}/:
    template: job-agency-seat

  /elections/:
    template: election
  /elections/{agency}/:
    template: election-agency
  /elections/{agency}/{seat}/:
    template: election-agency-seat
  /elections/{agency}/{seat}/{year}/:
    template: election-agency-seat-year
  
  /donors/:
    template: donors
  /donors/{slug}/:
    template: donor
  
  /finance/:
    template: finance
  /finance/{agency}/{seat}/:
    template: finance-agency-seat
  /finance/{seat}/:
    template: finance-seat
  # NOTE: no /finance/{seat}/{donor}/ route. It would be the same shape as
  # /finance/{agency}/{seat}/ above, and Ghost matches in declaration order, so it
  # was never reachable. Per-donor detail lives at /donors/{slug}/ below.

  /officials/:
    template: officials
  /official/{slug}/:
    template: official
  /officials/{agency}/: #seo
    template: official-agency

collections:
  /articles/:
    permalink: /articles/{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
