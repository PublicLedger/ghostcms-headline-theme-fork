name: Dependency Review

on:
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # Fail on any severity vulnerabilities
          fail-on-severity: low
          # Deny restrictive licenses in runtime dependencies
          deny-licenses: AGPL-3.0, SSPL-1.0
          # Comment on PR with findings
          comment-summary-in-pr: always
          # Note: this does NOT limit findings to production deps here. The
          # theme declares zero runtime dependencies (only devDependencies), 
          # yet the scan still failed -- the action reads pnpm-lock.yaml, 
          # which does not reliably express dev vs runtime scope, so dev-tree 
          # packages are evaluated anyway.
          fail-on-scopes: runtime
          # FORK CUSTOM: Ignore two known security issues in "brace-expansion" v1.1.15
          # 
          # Why we're allowing these vulnerabilities:
          # - They only affect development build tools (gscan, postcss-easy-import)
          # - The final theme contains only HTML, CSS, and JS files—no npm packages
          # - These vulnerabilities cannot impact users because the code isn't shipped
          # 
          # Why we can't just update the package:
          # - Our build tools lock to an older minimatch version
          # - That minimatch version requires this vulnerable brace-expansion
          # - Updating either would break the build process
          # 
          # Two vulnerabilities being ignored:
          #   GHSA-3jxr-9vmj-r5cp - DoS attack (fixable in v1.1.16, but we can't upgrade)
          #   GHSA-mh99-v99m-4gvg - DoS attack (no fix available for v1.x)
          # 
          # TODO: Remove this allowlist when gscan and postcss-easy-import
          # support newer minimatch versions.
          allow-ghsas: GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg
