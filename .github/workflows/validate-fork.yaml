name: Validate Fork Integrity
on:
  pull_request:
  push:
    branches:
      - main
      - staging
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-compliance:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/TryGhost/Headline.git || true
          git fetch upstream main

      - name: Validate LICENSE file unchanged
        run: |
          echo "🔍 Checking LICENSE file matches upstream..."
          
          if ! diff <(git show upstream/main:LICENSE) LICENSE; then
            echo "❌ ERROR: LICENSE file differs from upstream"
            echo ""
            echo "The LICENSE file must remain identical to TryGhost/Headline."
            echo "This is required by the MIT license terms."
            echo ""
            echo "To fix:"
            echo "  git show upstream/main:LICENSE > LICENSE"
            echo "  git add LICENSE"
            echo "  git commit -m 'fix: restore original LICENSE file'"
            exit 1
          fi
          
          echo "✅ LICENSE file is correct"

      - name: Validate package.json attribution
        run: |
          echo "🔍 Checking package.json author field..."
          
          # Extract author from upstream
          upstream_author=$(git show upstream/main:package.json | jq -r '.author.name')
          
          # Extract author from fork
          fork_author=$(jq -r '.author.name' package.json)
          
          if [[ "$fork_author" != "$upstream_author" ]]; then
            echo "❌ ERROR: package.json author must be '$upstream_author'"
            echo "Current author: $fork_author"
            echo ""
            echo "MIT license requires preserving original attribution."
            echo ""
            echo "To fix, set package.json author field to:"
            echo '  "author": {'
            echo '    "name": "Ghost Foundation",'
            echo '    "email": "hello@ghost.org",'
            echo '    "url": "https://ghost.org"'
            echo '  },'
            exit 1
          fi
          
          echo "✅ Author attribution is correct: $fork_author"

      - name: Validate contributors field exists
        run: |
          echo "🔍 Checking package.json contributors field..."
          
          if ! jq -e '.contributors' package.json > /dev/null; then
            echo "⚠️  WARNING: No contributors field found"
            echo "Consider adding fork maintainer to contributors array"
          else
            echo "✅ Contributors field exists"
            jq '.contributors' package.json
          fi

      - name: Validate description mentions fork
        run: |
          description=$(jq -r '.description' package.json)
          
          if [[ ! "$description" =~ [Ff]ork ]] && [[ ! "$description" =~ [Bb]ased ]]; then
            echo "⚠️  WARNING: Description should mention this is a fork"
            echo "Current: $description"
          else
            echo "✅ Description indicates fork status: $description"
          fi

  upstream-sync-check:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      # Labels are part of GitHub's Issues API even when applied to a PR, so
      # creating/attaching the "upstream-sync" label below needs this scope
      # too -- it is NOT used to open issues (see the step below).
      issues: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          ref: staging
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/TryGhost/Headline.git
          git fetch upstream main

      - name: Check sync status
        id: sync
        run: |
          # Get merge base (last common commit)
          merge_base=$(git merge-base HEAD upstream/main)
          
          # Count commits ahead/behind
          ahead=$(git rev-list --count $merge_base..HEAD)
          behind=$(git rev-list --count $merge_base..upstream/main)
          
          # Get latest upstream commit
          upstream_head=$(git rev-parse upstream/main)
          upstream_message=$(git log -1 --pretty=format:"%s" upstream/main)
          upstream_date=$(git log -1 --pretty=format:"%ci" upstream/main)
          
          echo "ahead=$ahead" >> $GITHUB_OUTPUT
          echo "behind=$behind" >> $GITHUB_OUTPUT
          echo "upstream_head=$upstream_head" >> $GITHUB_OUTPUT
          
          echo "## 📊 Upstream Sync Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fork vs TryGhost/Headline:**" >> $GITHUB_STEP_SUMMARY
          echo "- 🔼 Commits ahead: $ahead" >> $GITHUB_STEP_SUMMARY
          echo "- 🔽 Commits behind: $behind" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Latest upstream commit:**" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: \`$upstream_head\`" >> $GITHUB_STEP_SUMMARY
          echo "- Message: $upstream_message" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $upstream_date" >> $GITHUB_STEP_SUMMARY
          
          if [[ $behind -gt 0 ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Fork is behind upstream" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Consider syncing with upstream:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "./sync/upstream-sync.sh" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      # FORK CUSTOM: only set up the build toolchain when there's actually a
      # sync to attempt. workflow_dispatch is included alongside schedule so
      # the sync-PR flow can be exercised on demand instead of waiting for
      # Monday's cron.
      - name: Setup Node.js
        if: ${{ steps.sync.outputs.behind > 0 && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        if: ${{ steps.sync.outputs.behind > 0 && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: pnpm/action-setup@v6

      # FORK CUSTOM: replaces the old issue-bot. That step called `gh issue`
      # with no --repo while an `upstream` remote (TryGhost/Headline, issues
      # disabled) was also present, so gh's repo auto-detection resolved to
      # upstream and every scheduled run failed. This step never lets gh
      # infer the repo, and it doesn't just notify -- it merges upstream,
      # rebuilds, and validates, then opens the result as a PR here only if
      # everything passed.
      - name: Open or update sync PR
        if: ${{ steps.sync.outputs.behind > 0 && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          behind=${{ steps.sync.outputs.behind }}
          upstream_head=${{ steps.sync.outputs.upstream_head }}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ci-upstream-sync.sh merges, rebuilds (pnpm zip), and validates
          # (pnpm test + validate:fork) on a throwaway branch, and never
          # pushes. A conflict or a validation failure exits non-zero with
          # nothing pushed, so a bad upstream commit can only turn this job
          # red -- it can never overwrite an already-open, already-valid PR.
          #
          # Captured as a plain command substitution, not piped through
          # `tail`: `x=$(cmd | tail -n1)` gets its exit status from `tail`,
          # not `cmd`, unless `pipefail` is set -- which would silently
          # treat a failed sync as success. Deriving the branch name from
          # the already-captured output sidesteps the pipe entirely instead
          # of depending on a shell option this step doesn't set itself.
          sync_output=$(./scripts/ci-upstream-sync.sh)
          sync_status=$?
          branch=$(tail -n1 <<< "$sync_output")

          if [[ $sync_status -ne 0 ]]; then
            echo "## ❌ Upstream sync failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Merge or validation failed. Run \`./sync/upstream-sync.sh\` locally to sync manually." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Guards a race: the "Check sync status" step above and the script
          # both compute behind-ness independently, seconds apart. If
          # someone synced manually in between, the script exits 0 having
          # printed its "already up-to-date" message instead of a branch
          # name -- treat that as a no-op rather than pushing garbage.
          if [[ "$branch" != "upstream-sync/staging" ]]; then
            echo "Nothing to sync (already up-to-date)"
            exit 0
          fi

          # force-with-lease, not force: this branch is reused (not
          # date-suffixed) so every run can update the same open PR instead
          # of piling up a new one each week, but --with-lease still refuses
          # to clobber a push this workflow didn't make itself.
          git push --force-with-lease origin "$branch"

          body_file=$(mktemp)
          echo "## Summary" >> "$body_file"
          echo "" >> "$body_file"
          echo "Automated merge of TryGhost/Headline \`$upstream_head\` into \`staging\`, validated in CI." >> "$body_file"
          echo "" >> "$body_file"
          echo "## Work" >> "$body_file"
          echo "" >> "$body_file"
          echo "- **Upstream sync**" >> "$body_file"
          echo "  - Merged $behind commit(s) from upstream/main" >> "$body_file"
          echo "  - \`pnpm zip\` passed (theme builds)" >> "$body_file"
          echo "  - \`pnpm test\` passed (GScan validation)" >> "$body_file"
          echo "  - \`pnpm validate:fork\` passed (fork identity preserved)" >> "$body_file"
          # Built from fixed echo lines, not model-generated text, so it
          # matches .github/pull_request_template.md's Summary/Work
          # structure deterministically every run.

          # The label was previously only ever used on `gh issue create`
          # calls that never succeeded (see above), so it may not exist yet.
          # --force makes this create-or-update, safe to run every time.
          gh label create "upstream-sync" --repo "$GITHUB_REPOSITORY" \
            --color "0E8A16" --description "Automated upstream sync PR" --force

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')

          if [[ -n "$existing" ]]; then
            # Same branch name means the force-push above already updated
            # this PR's diff; refreshing the body just keeps the commit
            # count/date accurate. Title is left alone -- editing it every
            # run would just be churn.
            echo "Updating existing PR #$existing"
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            echo "Creating new sync PR"
            gh pr create --repo "$GITHUB_REPOSITORY" --base staging --head "$branch" \
              --label "upstream-sync" \
              --title "Sync upstream: $behind commits from TryGhost/Headline" \
              --body-file "$body_file"
          fi

  theme-integrity:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate theme builds
        run: pnpm zip

      - name: Validate GScan passes
        run: pnpm test

      - name: Check protected fork files
        run: |
          echo "🔍 Checking protected fork files exist..."
          
          protected_files=(
            "package.json"
            "LICENSE"
            "README.md"
            "sync/README.md"
            "sync/upstream-sync.sh"
          )
          
          for file in "${protected_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "❌ ERROR: Protected file missing: $file"
              exit 1
            fi
          done
          
          echo "✅ All protected files present"

      - name: Summary
        run: |
          echo "## ✅ Fork Integrity Validated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- LICENSE compliance: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Attribution correct: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Theme builds: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- GScan validation: ✅" >> $GITHUB_STEP_SUMMARY
