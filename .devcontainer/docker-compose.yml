services:
  # Development container with Node.js for theme building
  devcontainer:
    container_name: headline-devcontainer
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      # Mount Ghost database volume for seeding scripts
      - ghost-dev-data:/var/lib/ghost/content/data:rw
    command: sleep infinity
    network_mode: service:ghost-dev
    env_file:
      - ../.env
    depends_on:
      - ghost-dev

  # Ghost development instance (SQLite, auto-reload)
  ghost-dev:
    container_name: ghost-dev
    image: ghost:6-alpine
    restart: unless-stopped
    ports:
      - "3001:2368"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Install required tools for ghost-setup.sh (curl for API, openssl for JWT, sqlite for DB)
        apk add --no-cache curl openssl sqlite
        # Launch Ghost setup (admin account + theme activation) in background
        sh /var/lib/ghost/ghost-setup.sh &
        # Start Ghost normally (this replaces the current shell process)
        exec docker-entrypoint.sh node current/index.js
    environment:
      NODE_ENV: development
      url: http://localhost:3001
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost-dev.db
      # Disable email sending (prevents login notification errors)
      mail__transport: Direct
      mail__options__host: localhost
      # Auto-setup credentials (used by ghost-setup.sh)
      # Password must be 10+ chars, no common phrases (Ghost validation is strict)
      GHOST_ADMIN_EMAIL: admin@example.com
      GHOST_ADMIN_PASSWORD: RandomSecure123456789
      GHOST_ADMIN_NAME: PublicLedger Admin
      GHOST_SITE_TITLE: The Public Ledger
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2368/ghost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # Mount the theme from workspace (watched for changes)
      - ..:/var/lib/ghost/content/themes/headline:cached
      # Mount setup script (creates admin account + activates theme)
      - ./ghost-setup.sh:/var/lib/ghost/ghost-setup.sh:ro
      # Persistent storage for Ghost content
      - ghost-dev-data:/var/lib/ghost/content/data
      - ghost-dev-images:/var/lib/ghost/content/images
      - ghost-dev-logs:/var/lib/ghost/content/logs
      - ghost-dev-apps:/var/lib/ghost/content/apps
      - ghost-dev-settings:/var/lib/ghost/content/settings

volumes:
  ghost-dev-data:
  ghost-dev-images:
  ghost-dev-logs:
  ghost-dev-apps:
  ghost-dev-settings:
